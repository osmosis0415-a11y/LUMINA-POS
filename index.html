<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102c2a"><link rel="manifest" href="manifest.json"><title>Lumina POS</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f4f6f5;color:#142d2a}header{background:#102c2a;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center}nav{display:flex;overflow:auto;gap:8px;padding:12px;background:white;position:sticky;top:0;z-index:2}button,input,select{font:inherit;padding:10px;border:1px solid #cbd9d5;border-radius:8px}button{cursor:pointer;background:white;color:#143b34}button:hover,button.active{background:#087b65;color:white}button.primary{background:#087b65;color:white}main{padding:18px;max-width:1500px;margin:auto}.layout{display:grid;grid-template-columns:2fr 1fr;gap:16px}.panel{background:white;padding:18px;border-radius:14px;border:1px solid #e0e7e4}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.tile{text-align:left;min-height:90px}.line{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e5eae8}.line span:first-child{flex:1}.muted{color:#637772;font-size:13px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}h1,h2,h3{margin:0 0 12px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}.scroll{overflow:auto}#receipt{display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}main{padding:10px}header{padding:12px}}@media print{body>*{display:none!important}#receipt{display:block!important;color:black;background:white;padding:12px;font:12px monospace}#receipt .line{border-bottom:1px dashed #888}}
</style><header><strong style="font-size:23px">LUMINA / POS</strong><span id="network"></span></header><nav id="nav"></nav><main id="app"></main><section id="receipt"></section><script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'₹'+Number(n).toFixed(2),id=()=>crypto.randomUUID?.()||Date.now()+'-'+Math.random(),seed={menu:[{id:'1',name:'Masala Dosa',price:120,cost:40,stock:50},{id:'2',name:'Paneer Tikka',price:240,cost:90,stock:30},{id:'3',name:'Veg Biryani',price:180,cost:65,stock:40},{id:'4',name:'Coffee',price:100,cost:30,stock:80}],orders:{},sales:[],kots:[],expenses:[],tax:5,shop:'Lumina Cafe',gstin:''};let s;try{s=JSON.parse(localStorage.getItem('lumina-pos-v1'))||seed}catch{s=seed}let page='POS',table='T1',mode='Dine-in',search='',discount=0,payment='Cash';const save=()=>{localStorage.setItem('lumina-pos-v1',JSON.stringify(s))},key=()=>mode==='Dine-in'?table:mode,cart=()=>s.orders[key()]||[],subtotal=()=>cart().reduce((a,b)=>a+b.price*b.qty,0),net=()=>Math.max(0,subtotal()-discount),tax=()=>Math.round(net()*s.tax)/100,total=()=>net()+tax();
function change(p){page=p;render()}function add(i,d){let m=s.menu.find(x=>x.id===i),c=s.orders[key()]||[],r=c.find(x=>x.id===i);if(d>0&&(!m||(r?.qty||0)>=m.stock)){alert('Insufficient stock');return}if(r)r.qty+=d;else if(d>0)c.push({...m,qty:d});s.orders[key()]=c.filter(x=>x.qty>0);save();render()}
function pick(t){table=t;discount=0;render()}function setMode(v){mode=v;discount=0;render()}function printDoc(title,lines,extra=''){ $('receipt').innerHTML='<h2>'+esc(s.shop)+'</h2><div>'+esc(s.gstin)+'</div><h3>'+esc(title)+'</h3>'+lines.map(x=>'<div class="line"><span>'+esc(x.name)+' × '+x.qty+'</span><span>'+money(x.price*x.qty)+'</span></div>').join('')+extra;window.print()}
function kot(){if(!cart().length)return;let k={id:id(),time:new Date().toISOString(),table:key(),items:structuredClone(cart()),status:'Pending'};s.kots.push(k);save();printDoc('KOT '+k.table,k.items);render()}
function bill(){if(!cart().length)return;for(let r of cart()){let m=s.menu.find(x=>x.id===r.id);if(!m||m.stock<r.qty){alert('Stock changed: '+r.name);return}}let b={id:id(),number:s.sales.length+1,time:new Date().toISOString(),table:key(),items:structuredClone(cart()),subtotal:subtotal(),discount,tax:tax(),total:total(),payment,cost:cart().reduce((a,r)=>a+r.cost*r.qty,0)};for(let r of b.items)s.menu.find(x=>x.id===r.id).stock-=r.qty;s.sales.push(b);delete s.orders[key()];discount=0;save();render();receipt(b)}
function receipt(b){printDoc('Invoice '+b.number+' · '+new Date(b.time).toLocaleString(),b.items,'<p>Subtotal '+money(b.subtotal)+'<br>Discount '+money(b.discount)+'<br>GST '+money(b.tax)+'<br>Total '+money(b.total)+'<br>Payment '+esc(b.payment)+'</p>')}
function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportSales(){let rows=[['Invoice','Date','Order','Subtotal','Discount','GST','Total','Payment'],...s.sales.map(b=>[b.number,b.time,b.table,b.subtotal,b.discount,b.tax,b.total,b.payment])];download('sales.csv',rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')}
function menuAdd(e){e.preventDefault();let f=new FormData(e.target);s.menu.push({id:id(),name:f.get('name').trim(),price:+f.get('price'),cost:+f.get('cost'),stock:+f.get('stock')});save();render()}
function stock(i,v){let m=s.menu.find(x=>x.id===i);if(Number.isFinite(+v)&&+v>=0){m.stock=+v;save();render()}}
function expense(e){e.preventDefault();let f=new FormData(e.target);s.expenses.push({name:f.get('name'),amount:+f.get('amount'),time:new Date().toISOString()});save();render()}
function settings(e){e.preventDefault();let f=new FormData(e.target);s.shop=f.get('shop');s.gstin=f.get('gstin');s.tax=+f.get('tax');save();render()}
function render(){ $('network').textContent=navigator.onLine?'Online · local data':'Offline · local data';$('nav').innerHTML=['POS','Kitchen','Menu & Stock','Reports','Settings'].map(p=>'<button class="'+(p===page?'active':'')+'" onclick="change('+JSON.stringify(p).replaceAll('"','&quot;')+')">'+p+'</button>').join('');let h='';if(page==='POS'){h='<div class="layout"><section class="panel"><h2>New order</h2><div class="tools">'+['Dine-in','Takeaway','Delivery'].map(v=>'<button class="'+(mode===v?'active':'')+'" onclick="setMode(\''+v+'\')">'+v+'</button>').join('')+'</div>'+(mode==='Dine-in'?'<div class="tiles">'+Array.from({length:12},(_,i)=>'T'+(i+1)).map(t=>'<button class="'+(table===t?'active':'')+'" onclick="pick(\''+t+'\')">'+t+' '+(s.orders[t]?.length?'• Busy':'· Free')+'</button>').join('')+'</div>':'')+'<div class="tools"><input placeholder="Search menu" id="search" value="'+esc(search)+'" oninput="search=this.value;drawMenu()"></div><div class="tiles" id="menuTiles"></div></section><section class="panel"><h2>'+esc(key())+' order</h2>'+cart().map(r=>'<div class="line"><span>'+esc(r.name)+'<br><small>'+money(r.price)+'</small></span><button onclick="add(\''+r.id+'\',-1)">−</button>'+r.qty+'<button onclick="add(\''+r.id+'\',1)">+</button><b>'+money(r.qty*r.price)+'</b></div>').join('')+'<p>Subtotal <b>'+money(subtotal())+'</b></p><label>Discount ₹ <input type="number" min="0" max="'+subtotal()+'" value="'+discount+'" onchange="discount=Math.min(subtotal(),Math.max(0,+this.value||0));render()"></label><p>GST '+s.tax+'% · '+money(tax())+'</p><h2>'+money(total())+'</h2><select onchange="payment=this.value">'+['Cash','UPI','Card'].map(v=>'<option '+(v===payment?'selected':'')+'>'+v+'</option>').join('')+'</select><div class="tools"><button onclick="kot()">Print KOT</button><button class="primary" onclick="bill()">Settle & print</button></div></section></div>'}else if(page==='Kitchen'){h='<h2>Kitchen display</h2><div class="tiles">'+s.kots.slice().reverse().map(k=>'<section class="panel"><h3>'+esc(k.table)+'</h3><p>'+esc(k.status)+'</p>'+k.items.map(r=>'<p>'+esc(r.name)+' × '+r.qty+'</p>').join('')+'<button onclick="advance(\''+k.id+'\')">'+(k.status==='Pending'?'Start':k.status==='Preparing'?'Ready':'Completed')+'</button></section>').join('')+'</div>'}else if(page==='Menu & Stock'){h='<section class="panel"><h2>Menu & inventory</h2><form class="tools" onsubmit="menuAdd(event)"><input name="name" placeholder="Item name" required><input name="price" type="number" min="0" step=".01" placeholder="Price" required><input name="cost" type="number" min="0" step=".01" placeholder="Unit cost" required><input name="stock" type="number" min="0" step="1" placeholder="Stock units" required><button class="primary">Add item</button></form><div class="scroll"><table><tr><th>Item</th><th>Price</th><th>Unit cost</th><th>Stock</th></tr>'+s.menu.map(m=>'<tr><td>'+esc(m.name)+'</td><td>'+money(m.price)+'</td><td>'+money(m.cost)+'</td><td><input type="number" min="0" step="1" value="'+m.stock+'" onchange="stock(\''+m.id+'\',this.value)" style="width:100px"></td></tr>').join('')+'</table></div></section>'}else if(page==='Reports'){let revenue=s.sales.reduce((a,b)=>a+b.total-b.tax,0),cost=s.sales.reduce((a,b)=>a+b.cost,0),exp=s.expenses.reduce((a,b)=>a+b.amount,0);h='<h2>All-time reports</h2><div class="tiles">'+[['Net sales',revenue],['Item cost',cost],['Expenses',exp],['Estimated profit',revenue-cost-exp]].map(r=>'<section class="panel">'+r[0]+'<h2>'+money(r[1])+'</h2></section>').join('')+'</div><section class="panel"><h3>Expenses</h3><form class="tools" onsubmit="expense(event)"><input name="name" required placeholder="Description"><input name="amount" type="number" min=".01" step=".01" required placeholder="Amount"><button>Add expense</button></form>'+s.expenses.map(e=>'<div class="line"><span>'+esc(e.name)+'</span>'+money(e.amount)+'</div>').join('')+'</section><section class="panel"><div class="tools"><h3>Invoices</h3><button onclick="exportSales()">Export CSV</button></div>'+s.sales.slice().reverse().map(b=>'<div class="line"><span>#'+b.number+' · '+esc(b.table)+' · '+esc(b.payment)+'</span>'+money(b.total)+'<button onclick="receipt(s.sales.find(x=>x.number==='+b.number+'))">Print</button></div>').join('')+'</section>'}else{h='<section class="panel"><h2>Settings</h2><form class="tools" onsubmit="settings(event)"><input name="shop" required value="'+esc(s.shop)+'" placeholder="Business name"><input name="gstin" value="'+esc(s.gstin)+'" placeholder="GSTIN"><input name="tax" type="number" min="0" max="100" step=".01" required value="'+s.tax+'"><button>Save</button></form><p class="muted">Tax rate is configurable; confirm applicable tax and invoice requirements before commercial use.</p><button onclick="download(\'lumina-backup.json\',JSON.stringify(s),\'application/json\')">Download backup</button><p>Local browser storage only. No online payment collection, authentication or multi-device sync.</p></section>'}$('app').innerHTML=h;if(page==='POS')drawMenu()}
function drawMenu(){$('menuTiles').innerHTML=s.menu.filter(m=>m.name.toLowerCase().includes(search.toLowerCase())).map(m=>'<button class="tile" onclick="add(\''+m.id+'\',1)"><strong>'+esc(m.name)+'</strong><p>'+money(m.price)+'</p><small>'+m.stock+' in stock</small></button>').join('')}
function advance(i){let k=s.kots.find(x=>x.id===i);k.status=k.status==='Pending'?'Preparing':'Ready';save();render()}window.addEventListener('online',render);window.addEventListener('offline',render);render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(console.error);
</script></html>
