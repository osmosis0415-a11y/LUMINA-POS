<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumina · Table menu</title><style>body{font:16px system-ui;background:#f4f6f5;color:#14332e;margin:0}header{background:#102c2a;color:white;padding:24px}main{max-width:650px;margin:auto;padding:16px}article,section{background:white;border-radius:12px;padding:16px;margin:12px 0}button,input,textarea{font:inherit;padding:12px;border-radius:8px;border:1px solid #cbd9d5}button{background:#087b65;color:white;cursor:pointer}textarea{box-sizing:border-box;width:100%}.line{display:flex;align-items:center;justify-content:space-between;gap:8px}small{color:#687b74}</style><header><h1 id="shop">Lumina Cafe</h1><div id="table"></div></header><main><p id="status" role="status"></p><div id="items"></div><section><h2>Your order</h2><div id="basket"></div><textarea id="notes" maxlength="300" placeholder="Special instructions"></textarea><p><button id="send">Send order</button></p><small>Staff will confirm your order and final bill. No online payment is collected.</small></section></main><script>
const q=new URLSearchParams(location.search),table=q.get('table'),token=q.get('token'),$=id=>document.getElementById(id),safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>'₹'+Number(v).toFixed(2);let items=[],cart={},cfg={},busy=false;
$('table').textContent=table?'Table '+table:'Table not selected';
async function rpc(name,args){const r=await fetch(cfg.url+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:cfg.key,Authorization:'Bearer '+cfg.key,'Content-Type':'application/json'},body:JSON.stringify(args)});if(!r.ok)throw Error('Request failed');return r.json()}
function draw(){$('items').innerHTML=items.map((m,i)=>'<article class="line"><div><b>'+safe(m.name)+'</b><p>'+money(m.price)+'</p></div><button data-add="'+i+'">Add +</button></article>').join('');$('basket').innerHTML=items.map((m,i)=>cart[i]?'<p class="line"><span>'+safe(m.name)+' × '+cart[i]+'</span><button data-remove="'+i+'">−</button></p>':'').join('')+'<h3>'+money(items.reduce((a,m,i)=>a+m.price*(cart[i]||0),0))+'</h3>';$('send').disabled=busy||!Object.values(cart).some(Boolean)}
document.addEventListener('click',e=>{if(e.target.dataset.add!==undefined){let i=e.target.dataset.add;cart[i]=Math.min(20,(cart[i]||0)+1);draw()}if(e.target.dataset.remove!==undefined){let i=e.target.dataset.remove;cart[i]=Math.max(0,cart[i]-1);draw()}});
$('send').onclick=async()=>{if(busy)return;busy=true;draw();try{let order=await rpc('submit_table_order',{p_table:table,p_token:token,p_items:items.map((m,i)=>({id:m.id,qty:cart[i]||0})).filter(m=>m.qty),p_notes:$('notes').value});cart={};$('notes').value='';$('status').textContent='Order sent for staff approval. Reference: '+order}catch(e){$('status').textContent='Order not sent. Please ask your waiter or retry.'}finally{busy=false;draw()}};
(async()=>{try{cfg=await fetch('./config.json',{cache:'no-store'}).then(r=>r.json());if(!cfg.url||!cfg.key||!table||!token)throw Error();let data=await rpc('table_menu',{p_table:table,p_token:token});items=data.items;$('shop').textContent=data.shop;$('status').textContent='Order directly from your table.';draw()}catch(e){$('status').textContent='Ordering is not configured or this table QR is invalid. Please ask staff.';$('send').disabled=true}})();
</script></html>
